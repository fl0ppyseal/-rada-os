name: Build Rada OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build ISO in Debian 12 container
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD":/src -w /src \
            -e RADA_OUTDIR=/src/out -e RADA_WORKDIR=/var/tmp/rada-build \
            debian:bookworm \
            bash -c 'apt-get update && apt-get install -y util-linux ca-certificates && bash build-rada-os.sh --clean --xfce'
          ls -lh out

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: rada-os-iso
          path: out/*
          retention-days: 7
          compression-level: 0
